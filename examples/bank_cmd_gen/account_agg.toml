# account_agg.toml —— 聚合词表
# 表头三件 = gen 体例键，非协议字段。
# 消费者径：发射器不随本模块发布——本表即设计工作表，按分区手写同等
# 结构（配方见 README「手写聚合配方」）；「生成物包含」段 = 手写验收清单。
# 或走 moonx 命令面：moonx thy1016/cmd@latest <table.toml>（@latest 恒写；
# 产出 gen/contract/policy 三件，policy 仅缺位时落——stub-zone）。

schema_version = "1.0"
generator = "mooncmd_agg_gen"
target_package = "mooncmd/examples/bank_cmd"

[aggregate]
name = "account"
id = "string"

[aggregate.state]
fields = [
  { name = "name", type = "string", init = '""' },
  { name = "balance", type = "int", init = "0" },
  { name = "is_active", type = "bool", init = "false" },
]

[[aggregate.events]]
name = "AccountCreated"
fields = [
  { name = "name", type = "string" },
  { name = "initial", type = "int" },
]
evolve = ["set name=name", "set balance=initial", "set is_active=true"]

[[aggregate.events]]
name = "MoneyDeposited"
fields = [
  { name = "amount", type = "int" },
]
evolve = ["add balance=amount"]

[[aggregate.events]]
name = "MoneyWithdrawn"
fields = [
  { name = "amount", type = "int" },
]
evolve = ["add balance=-amount"]

[[aggregate.events]]
name = "AccountClosed"
fields = []
evolve = ["set is_active=false"]

[[aggregate.commands]]
name = "CreateAccount"
fields = [
  { name = "name", type = "string" },
  { name = "initial", type = "int" },
]

[[aggregate.commands]]
name = "DepositMoney"
fields = [
  { name = "amount", type = "int" },
]

[[aggregate.commands]]
name = "WithdrawMoney"
fields = [
  { name = "amount", type = "int" },
]

[[aggregate.commands]]
name = "CloseAccount"
fields = []

# 役10 serde 键控（A′案:序列化 impl = 表的投影;键关 = 旧表字节稳零发射）
[aggregate.serde]
json = true
