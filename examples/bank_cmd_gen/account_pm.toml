schema_version = "0.2.0"
generator = "skelschema/pm_toml_gen.mbt"
target_package = "mooncmd/examples/bank_cmd_gen"

# 转账 Process Manager（役13b 词表样例）：盯源账户事件 → 向目标账户发命令。
# saga_key = 信封 aggregate_id（每源账户一个 saga 实例）。

[process_manager]
name = "transfer"
event_type = "AccountEvent"
command_type = "AccountCommand"
saga_key = "aggregate_id"

[process_manager.state]

[[process_manager.state.fields]]
name = "transferred"
type = "int"

[[process_manager.state.fields]]
name = "closed"
type = "bool"
init = "false"

[[process_manager.watch]]
event = "MoneyWithdrawn"
fields = [{ name = "amount", type = "int" }]
target = "account-2"
emit = [{ command = "DepositMoney", args = ["amount=amount"] }]
apply = ["add transferred=amount"]

[[process_manager.watch]]
event = "AccountClosed"
fields = []
target = "account-2"
emit = [{ command = "CloseAccount", args = [] }]
apply = ["set closed=true"]
